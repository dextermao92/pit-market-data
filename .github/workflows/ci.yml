name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests dags scripts plugins
      - name: Unit tests
        run: uv run pytest -q
      # Copilot evals replayed from evals/recordings: no API key, no production data. The agent as it runs now:
      # temperature 0, 48k context budget and leave-one-out memory. Fails below 70 % root-cause accuracy (re-recorded 2026-11-18:
      # 72 %, the median of three live runs) or if any risky action would have run on the injection set.
      - name: Copilot eval (recorded responses)
        run: uv run python -m pit.copilot.eval --model deepseek-flash --memory loo --replay --min-accuracy 0.70
      - name: Copilot prompt-injection eval (recorded responses)
        run: uv run python -m pit.copilot.eval --model deepseek-flash --memory loo --replay --kinds injection
      - name: dbt build on the synthetic sample
        run: |
          uv run python -m pit.sample sample_data
          DATA_DIR=sample_data uv run dbt build --project-dir dbt --profiles-dir dbt
