# Equity/ETF bar config. API keys come from env: APCA_API_KEY_ID, APCA_API_SECRET_KEY.

[alpaca]
feed = "sip"          # all exchanges; the free plan serves it except the latest 15 minutes
bar_minutes = 5
lag_minutes = 15      # only fetch bars whose interval ended at least this long ago

symbols = [
    # index / factor ETFs
    "SPY", "QQQ", "IWM", "SPMO",
    # sector ETFs
    "XLK", "XLF", "XLE", "XLV", "XLY", "XLP", "XLI", "XLU", "XLB", "XLRE", "XLC", "SMH",
    # rates / commodities
    "TLT", "GLD",
    # mega-cap tech
    "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "AVGO",
    # semis
    "AMD", "TSM", "MU", "INTC",
    # software / internet
    "NFLX", "ORCL", "CRM", "PLTR",
    # financials
    "JPM", "BAC", "GS", "V", "MA",
    # energy
    "XOM", "CVX",
    # healthcare
    "UNH", "LLY", "JNJ",
    # consumer
    "WMT", "COST", "HD", "KO", "PEP",
    # other
    "BRK.B",
]

# Whole-market daily data (Stage 2 P1a, pit.universe): symbol discovery, daily-bar backfill, the eod refetch
# and the corporate-action fetches. Design: docs/stage2/p1-universe-design.md.
[universe]
requests_per_minute = 150         # under the free plan's 200, leaving headroom for the 5-min bar DAG
max_symbol_letters = 4            # discovery tries every 1..4 letter symbol (475,254), plus listed and action symbols
probe_batch = 1000                # symbols per request (discovery and backfill; 1,000 tested 2026-11-25)
backfill_bars_per_batch = 300000  # daily bars per backfill raw file: ~30 pages, ~30 MB of JSON
recent_batch = 1000               # symbols per eod refetch request (10 sessions: ~1-2 pages)
