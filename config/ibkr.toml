# IBKR collection: option chains + index levels. IB_HOST / IB_PORT env vars override host/port
# (docker-compose sets them to the ib-gateway service). Add an underlying or index by adding a block.

[ibkr]
host = "127.0.0.1"
port = 4002              # paper API, as published by docker-compose
client_id = 11           # option chains; indices use client_id + 1
market_data_type = 1     # 1 live, 2 frozen, 3 delayed, 4 delayed-frozen
batch_size = 90          # contracts streamed at once; default account limit is 100 lines
wait_seconds = 3         # min time to collect ticks per batch
max_wait_seconds = 15    # keep waiting until every contract has ticked, up to this
run_budget_seconds = 360 # a run stops starting work after this (task timeout is 8 min); chains go in config order

# Each chain: an underlying + trading class, which expiries, which strikes, how often.
#   expiries: dte = [min, max]      every expiry with min <= DTE <= max
#             target_dte = [...]    the expiry nearest each target (deduplicated)
#   strikes:  rights = "both" | "otm" (puts below spot, calls above; ITM follows from put-call parity)
#             put_range / call_range: how far below / above spot, as a fraction
#             strike_steps = [[max |moneyness|, step], ...]: keep strikes that are multiples of step
#             monthly = true        ...third-Friday expiries only (underlyings that list dailies/weeklies)
#   every_minutes: multiple of 5 (the DAG cadence); offset_minutes staggers it (slot % every == offset).
#   Contracts already taken by an earlier chain are skipped.

[[chains]]
name = "spx_intraday"     # short-dated context (vol premium, intraday skew); not traded, so every 15 min
symbol = "SPX"
sec_type = "IND"
exchange = "CBOE"
currency = "USD"
trading_class = "SPXW"
dte = [0, 2]
rights = "both"
put_range = 0.05
call_range = 0.05
strike_steps = [[1.0, 5]]
every_minutes = 15

[[chains]]
name = "spx_monthly"      # 30-45 DTE short puts, tail hedges: every standard monthly, 400 DTE to expiry
symbol = "SPX"            # the SPX (AM-settled) class lists only standard monthlies + December LEAPS;
sec_type = "IND"          # IBKR dates them by last trading day (Thursday, or Wednesday before a holiday)
exchange = "CBOE"
currency = "USD"
trading_class = "SPX"
dte = [3, 400]
rights = "otm"
put_range = 0.40
call_range = 0.15
strike_steps = [[0.10, 25], [1.0, 50]]
every_minutes = 5

[[chains]]
name = "spx_weekly"       # 30-45 DTE entry/management band: every SPXW expiry (weeklies, dailies, PM monthlies)
symbol = "SPX"            # 20-60 DTE (~17 expiries). Narrower wings than the monthlies, which carry the deep tails.
sec_type = "IND"
exchange = "CBOE"
currency = "USD"
trading_class = "SPXW"
dte = [20, 60]
rights = "otm"
put_range = 0.25
call_range = 0.10
strike_steps = [[0.10, 25], [1.0, 50]]
every_minutes = 5

[[chains]]
name = "spx_leaps"        # beyond the monthlies: LEAPS out to ~2 years
symbol = "SPX"
sec_type = "IND"
exchange = "CBOE"
currency = "USD"
trading_class = "SPX"
dte = [401, 800]
rights = "otm"
put_range = 0.40
call_range = 0.15
strike_steps = [[0.10, 25], [1.0, 50]]
every_minutes = 5

[[chains]]
name = "xsp_weekly"       # Mini-SPX (1/10 SPX, $1 strikes): its own spreads/liquidity for small-size put selling.
symbol = "XSP"            # The SPX chains carry the surface, so every 15 min in the free slot, narrower wings.
sec_type = "IND"
exchange = "CBOE"
currency = "USD"
trading_class = "XSP"
dte = [20, 60]
rights = "otm"
put_range = 0.15
call_range = 0.05
strike_steps = [[0.10, 2.5], [1.0, 5]]   # same grid as SPX's 25 / 50
every_minutes = 15
offset_minutes = 10       # :10/:25/:40/:55: no other 15-min chain runs then

# Second-tier underlyings: nearest monthlies (~4), narrower OTM wings, every 15 min.
[[chains]]
name = "qqq_monthly"
symbol = "QQQ"
sec_type = "STK"
exchange = "SMART"
currency = "USD"
trading_class = "QQQ"
dte = [3, 120]
monthly = true
rights = "otm"
put_range = 0.20
call_range = 0.10
strike_steps = [[0.10, 5], [1.0, 10]]
every_minutes = 15
offset_minutes = 5        # :05/:20/:35/:50, off the SPX 0-2 DTE chain's :00/:15/:30/:45

