version: 2

models:
  - name: bars_current
    data_tests:
      - unique: {column_name: "symbol || '|' || bar_start::varchar"}
    columns:
      - name: close
        data_tests: [not_null]
  - name: daily_bars_current
    data_tests:
      - unique: {column_name: "symbol || '|' || bar_start::varchar"}
  - name: corporate_actions_current
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: type
        data_tests:
          - accepted_values:
              arguments: {values: [forward_split, reverse_split, stock_dividend, cash_dividend]}
  - name: security_master
    data_tests:
      - unique: {column_name: "asset_id || '|' || valid_from::varchar"}
      - unique: {column_name: "case when is_current then asset_id end"}
  - name: market_calendar
    columns:
      - name: day
        data_tests: [unique, not_null]
      - name: is_session
        data_tests: [not_null]
  - name: universe_daily
    description: Who a strategy could trade at each session's open, from what was known before it (P1b section 4).
    columns:
      - name: session
        data_tests: [not_null]
      - name: security_id
        data_tests: [not_null]
      - name: type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [common, adr, fund, preferred, debt, warrant, right, unit, spac, when_issued, unknown]
      - name: eligible
        data_tests: [not_null]
  - name: option_quotes
    columns:
      - name: mid
        data_tests: [not_null]
