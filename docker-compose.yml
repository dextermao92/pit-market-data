name: pit-market-data

services:
  postgres:  # Airflow metadata only; market data lives in ./data as files
    image: postgres:17.6
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ib-gateway:  # IB Gateway + IBC; read-only API. TRADING_MODE/IB_PORT in .env: paper/4004 (default) or live/4003
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f
    # The image hard-codes IBC's command server off; enable it for the airflow container only (by its fixed IP:
    # IBC matches ControlFrom against the reverse-resolved peer, which is the long compose container name)
    # (RECONNECTDATA / RESTART for self-healing), then start as the image does.
    command: >
      sh -c "sed -i -e 's/^CommandServerPort=0/CommandServerPort=7462/' -e 's/^ControlFrom=.*/ControlFrom=172.30.0.10/'
      /home/ibgateway/ibc/config.ini.tmpl && exec /home/ibgateway/scripts/run.sh"
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "yes"
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TIME_ZONE: America/New_York
      AUTO_RESTART_TIME: "11:45 PM"  # daily, no 2FA; pre-open data-farm drops are healed by the 09:02 check
      TWOFA_TIMEOUT_ACTION: restart
      TWOFA_DEVICE: ${TWOFA_DEVICE:-}  # exact name in the 2FA device list; empty = pick it by hand over VNC
      EXISTING_SESSION_DETECTED_ACTION: primary  # Gateway keeps its session if the same user logs in elsewhere
    ports:
      - "127.0.0.1:4002:4004"  # paper API, for running the collector from the host
      - "127.0.0.1:4001:4003"  # live API (read-only)
      - "127.0.0.1:5900:5900"  # VNC, only if VNC_SERVER_PASSWORD is set
    restart: unless-stopped

  airflow:  # `standalone` = scheduler + dag-processor + api-server + triggerer in one container
    networks:
      default:
        ipv4_address: 172.30.0.10  # IBC ControlFrom
    build: .
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # local only, no login
      PYTHONPATH: /opt/airflow/src
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4004}
      DATA_DIR: /opt/airflow/data
      DBT_RESULTS_DIR: /opt/airflow/dbt/target  # not DBT_TARGET: dbt reads that as the profile target name
      IBKR_CONFIG: /opt/airflow/config/ibkr.toml
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}  # pit.sec: SEC asks for a contact address in the User-Agent
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # The Copilot's HTTP API (POST /ask, pit.copilot.api). Opt-in: `docker compose --profile copilot up -d api`; a plain
  # `docker compose up -d` leaves it out. Bearer token PIT_API_TOKEN from .env (/ask is off without one). Its own
  # network: no route to ib-gateway, and risky tools are off (PIT_COPILOT_NO_ACTIONS=1). Data is read-only except
  # the LLM call log and the traces it writes.
  api:
    profiles: [copilot]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PIT_API_TOKEN: ${PIT_API_TOKEN:-}
      PIT_COPILOT_NO_ACTIONS: "1"
      DATA_DIR: /app/data
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./ops:/app/ops:ro
      - ./README.md:/app/README.md:ro
      - ./data:/app/data:ro
      - ./data/llm_calls:/app/data/llm_calls
      - ./data/copilot_traces:/app/data/copilot_traces
    networks: [copilot]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      retries: 3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  copilot: {}

volumes:
  pgdata:
