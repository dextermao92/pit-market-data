[project]
name = "pit-market-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "ib_async==2.1.0",
    "polars==1.44.2",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.6",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pit"]
